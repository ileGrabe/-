<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ "/feed.xml" | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1 class="site-title"><a href="{{ "/" | relative_url }}">{{ site.title }}</a></h1>
        <nav class="site-nav">
          <a href="{{ "/" | relative_url }}">首页</a>
          <a href="{{ "/blog" | relative_url }}">随笔</a>
          <a href="{{ "/about" | relative_url }}">关于</a>
        </nav>
      </div>
    </header>

    <main class="page-content">
      <div class="container">
        {{ content }}
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© {{ site.time | date: "%Y" }} {{ site.title }} — 随笔即生活</p>
      </div>
    </footer>
  </body>
</html>
